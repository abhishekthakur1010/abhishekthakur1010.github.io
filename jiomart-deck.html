<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JioMart Discovery — Interview Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/jiomart-deck.css?v=17" />
  </head>

  <body class="deck" data-theme="dark">
    <!-- top bar -->
    <header class="topbar">
      <a class="brand" href="./jiomart-discovery.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Case study
      </a>
      <div class="tb-mini">JioMart · Product Discovery · Interview deck</div>
      <div class="tb-right">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light / dark">
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="counter"><b id="slideNow">01</b> / <span id="slideTotal">13</span></div>
      </div>
    </header>

    <!-- left section navigator (5 verticals) -->
    <nav class="section-rail" id="sectionRail" aria-label="Sections"></nav>

    <!-- slide stage -->
    <main class="stage" id="deckStage"></main>

    <!-- bottom navigation -->
    <div class="deck-nav">
      <button class="nav-btn" id="navPrev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="nav-hint">← → or Space</span>
      <button class="nav-btn" id="navNext" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <!-- evidence overlay -->
    <div class="ev-panel" id="evidencePanel" aria-hidden="true">
      <div class="ev-backdrop"></div>
      <aside class="ev-card" role="dialog" aria-label="Evidence">
        <button class="ev-close" aria-label="Close">×</button>
        <div class="ev-body"></div>
      </aside>
    </div>

    <script src="js/jiomart-deck-slides.js?v=17"></script>
    <script src="js/jiomart-deck.js?v=17"></script>
  </body>
</html>
