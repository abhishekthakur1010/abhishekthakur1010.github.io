<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 6 212 172" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0f6"/>
      <stop offset=".55" stop-color="#7a80ea"/>
      <stop offset="1" stop-color="#6a6fdd"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c70c6"/>
      <stop offset="1" stop-color="#555aa9"/>
    </linearGradient>
    <radialGradient id="ring" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe9ef"/>
    </radialGradient>
    <radialGradient id="cap" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#b9ecf7"/>
      <stop offset="1" stop-color="#6cc3dc"/>
    </radialGradient>
    <radialGradient id="orange" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd29a"/><stop offset="1" stop-color="#f3a75a"/></radialGradient>
    <radialGradient id="pink" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffb3cf"/><stop offset="1" stop-color="#e46f9c"/></radialGradient>
    <radialGradient id="mint" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe6ee"/></radialGradient>
    <radialGradient id="cyan" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#a8ecf6"/><stop offset="1" stop-color="#55bcd6"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2a1660" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <!-- shoulder buttons -->
    <rect x="34" y="26" width="38" height="16" rx="8" fill="#5c61b4"/>
    <rect x="128" y="26" width="38" height="16" rx="8" fill="#5c61b4"/>
    <!-- extrusion, then the body -->
    <path transform="translate(0 6)" fill="#4f54ad" d="M40 38C62 27 138 27 160 38C183 50 197 110 189 133C183 150 162 152 150 137L135 114C121 105 79 105 65 114L50 137C38 152 17 150 11 133C3 110 17 50 40 38Z"/>
    <path fill="url(#body)" d="M40 38C62 27 138 27 160 38C183 50 197 110 189 133C183 150 162 152 150 137L135 114C121 105 79 105 65 114L50 137C38 152 17 150 11 133C3 110 17 50 40 38Z"/>
    <path fill="url(#sheen)" d="M40 38C62 27 138 27 160 38C183 50 197 110 189 133C183 150 162 152 150 137L135 114C121 105 79 105 65 114L50 137C38 152 17 150 11 133C3 110 17 50 40 38Z"/>
    <!-- touchpad -->
    <rect x="77" y="36" width="46" height="30" rx="9" fill="#4f54ad" transform="translate(0 2)"/>
    <rect x="77" y="36" width="46" height="30" rx="9" fill="url(#dark)"/>
    <!-- d-pad -->
    <g transform="translate(0 2.5)" fill="#3f4497">
      <rect x="45" y="50" width="11" height="34" rx="3.5"/><rect x="33.5" y="61.5" width="34" height="11" rx="3.5"/>
    </g>
    <g fill="url(#dark)">
      <rect x="45" y="50" width="11" height="34" rx="3.5"/><rect x="33.5" y="61.5" width="34" height="11" rx="3.5"/>
    </g>
    <!-- face buttons -->
    <g fill="#4f54ad">
      <circle cx="152" cy="51.5" r="7.5"/><circle cx="166" cy="65.5" r="7.5"/><circle cx="138" cy="65.5" r="7.5"/><circle cx="152" cy="79.5" r="7.5"/>
    </g>
    <circle cx="152" cy="49" r="7.5" fill="url(#orange)"/>
    <circle cx="166" cy="63" r="7.5" fill="url(#pink)"/>
    <circle cx="138" cy="63" r="7.5" fill="url(#mint)"/>
    <circle cx="152" cy="77" r="7.5" fill="url(#cyan)"/>
    <!-- sticks -->
    <g>
      <circle cx="76" cy="93" r="15" fill="#b5d3dd"/>
      <circle cx="76" cy="90" r="15" fill="url(#ring)"/>
      <circle cx="76" cy="90" r="9" fill="url(#cap)"/>
      <circle cx="124" cy="93" r="15" fill="#b5d3dd"/>
      <circle cx="124" cy="90" r="15" fill="url(#ring)"/>
