<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis TDP · Interactive prototype (V1)</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--ink:#f3f4f6;--mute:#9ca3af;--line:#262a33;--red:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:20px;max-width:1500px;margin:0 auto;min-height:100vh;align-items:start}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45);aspect-ratio:2000/1194;cursor:pointer}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s ease;user-select:none;-webkit-user-drag:none}
.stage img.hide{opacity:0}
.hot{position:absolute;border-radius:8px;cursor:pointer;outline:2px solid transparent;transition:outline-color .2s,background .2s}
.hot::after{content:"";position:absolute;right:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(239,68,68,.7);animation:pulse 1.6s infinite}
.hot:hover,.flash .hot{outline-color:var(--red);background:rgba(239,68,68,.10)}
.nohint .hot::after{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
aside{position:sticky;top:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h2{font-size:20px;line-height:1.3;margin:6px 0 10px}
.why{color:#d1d5db;margin:0 0 14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#2a1215;color:#fca5a5;border:1px solid #4c1d1d;margin-bottom:12px}
.do{font-size:14px;background:#1f2430;border-radius:8px;padding:10px 12px;margin-bottom:16px}
.do b{color:#fca5a5}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.bar button{width:22px;height:6px;border-radius:3px;border:0;background:#333a46;cursor:pointer;padding:0}
.bar button.on{background:var(--red)}
.nav{display:flex;gap:8px;align-items:center}
.nav button{background:#1f2430;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.nav button:hover{border-color:#4b5563}
label.t{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-top:14px;cursor:pointer}
.note{font-size:12px;color:var(--mute);margin-top:12px}
body.embed .wrap{padding:0;grid-template-columns:1fr;gap:12px;min-height:0}
body.embed aside{position:static;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 16px}
body.embed aside h2{font-size:16px;margin:2px 0}
body.embed .why{margin:0;font-size:13px}
body.embed .do,body.embed label.t,body.embed .note,body.embed .tag{display:none}
body.embed .bar{margin:6px 0 0}
body.embed .side{grid-column:2;grid-row:1/span 3;align-self:center}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:12px}aside{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" aria-live="polite"></div>
  <aside>
    <div class="k" id="count">Step 1 of 14</div>
    <h2 id="title"></h2>
    <span class="tag" id="tag"></span>
    <p class="why" id="why"></p>
    <div class="do" id="do"></div>
    <div class="side">
      <div class="nav">
        <button id="prev" aria-label="Previous screen">← Back</button>
        <button id="next" aria-label="Next screen">Next →</button>
        <button id="restart" aria-label="Restart">Restart</button>
      </div>
      <div class="bar" id="bar"></div>
    </div>
    <label class="t"><input type="checkbox" id="hint" checked> Show red click indicators</label>
    <p class="note">Click the highlighted area on the screen, or use ← → keys. Clicking anywhere else flashes the hotspot.</p>
  </aside>
</div>
<script>
// Coordinates are in a 2000 × 1194 frame (the exported screens scaled to 2000px wide).
const W=2000,H=1194;
const S=[
 {img:"p01-start",title:"A fresh ticket lands",tag:"New agent, first ticket",why:"One thread, one action bar. Reply, Note, Forward and Escalate to Ops sit together under the conversation instead of hiding in menus. The queue on the left shows each ticket's SLA as a red chip.",do:"Click <b>Reply</b>.",hot:[555,1037,692,1080],go:1},
 {img:"p02-reply-draft",title:"Reply with the customer prefilled",tag:"Reply",why:"The recipient is filled in, Cc/Bcc are one click away, and the formatting, attachment, canned-response and voice tools sit in one row above Send.",do:"Click <b>Send</b>.",hot:[1365,1115,1490,1162],go:2},
 {img:"p03-reply-sent",title:"The reply lands in the thread",tag:"Reply",why:"Outbound messages are blue with the agent's name, role and team, so anyone picking up the ticket sees who said what and when.",do:"Next, leave an internal note. Click <b>Note</b>.",hot:[707,1037,802,1080],go:3},
 {img:"p04-note-draft",title:"Notes are internal by design",tag:"Private note",why:"Note mode swaps the To field for Notify To, so the hub and security teams are pinged without the customer ever seeing it.",do:"Click <b>Add Note</b>.",hot:[1368,1110,1490,1162],go:4},
 {img:"p05-note-added",title:"Yellow means internal",tag:"Private note",why:"Private notes are yellow and tagged, so they can't be confused with a customer reply. In the old TDP, notes and replies looked the same.",do:"Now the action that never existed: click <b>Escalate to Ops</b>.",hot:[950,1037,1132,1080],go:5},
 {img:"p06-escalate-form",title:"Escalation in one step",tag:"Escalate to Ops",why:"Facility and escalation level (TL, then ATL) are filled in from the ticket. The agent only adds context. Before, agents had to find the right email and write it outside Jarvis.",do:"Click <b>Escalate</b>.",hot:[1376,1110,1490,1162],go:6},
 {img:"p07-escalated",title:"Escalation is logged, not lost",tag:"Escalate to Ops",why:"The escalation shows in the thread with who it went to and when. The button greys out, so nobody escalates the same ticket twice.",do:"Agents on the floor often talk faster than they type. Click the <b>mic</b>.",hot:[1438,1126,1478,1168],go:7},
 {img:"p08-voice-recording",title:"Dictate the reply",tag:"Voice reply",why:"Recording happens inline with pause, stop and discard controls, so the agent never leaves the ticket.",do:"Click <b>Stop</b> (the square).",hot:[1304,1112,1345,1155],go:8},
 {img:"p09-voice-transcript",title:"Check the transcript before it goes",tag:"Voice reply",why:"The audio is transcribed so the agent can read what will be sent, and the customer gets both the audio and the text.",do:"Click <b>Send</b>.",hot:[1365,1115,1490,1162],go:9},
 {img:"p10-voice-sent",title:"Voice and text, side by side",tag:"Voice reply",why:"The thread keeps the playable audio and its transcript together, so the next agent can scan it without listening.",do:"Now check the SLA. Click <b>Ticket Details</b>.",hot:[1782,288,1960,338],go:10},
 {img:"p11-ticket-details",title:"SLA in plain words",tag:"SLA clarity",why:"\"First response overdue by 5h\" and \"Resolution due tomorrow, 6PM\" replace raw timestamps. The shipment's current centre is flagged red when it has been ageing for 24h.",do:"Click <b>Related Tickets</b> at the bottom.",hot:[1572,1128,1975,1180],go:11},
 {img:"p12-related-tickets",title:"Context from related tickets",tag:"Context",why:"Other tickets for the same shipment group open inline with status and ticket ID, so the agent can spot a repeat issue before replying.",do:"Click the <b>canned responses</b> icon in the composer.",hot:[1398,1126,1442,1168],go:12},
 {img:"p13-canned-responses",title:"Canned responses without leaving the ticket",tag:"Speed",why:"Responses open in the side panel, searchable by folder. Plus inserts a response and the swap icon replaces the draft, which helps new agents reply in the house tone.",do:"Last one: click <b>AI Summary</b> at the top.",hot:[1652,200,1808,246],go:13},
 {img:"p14-ai-summary",title:"AI summary for a quick handover",tag:"AI resolution",why:"The summary pulls out key ticket and package details, recent updates and ownership. Thumbs up or down feed back into the model.",do:"Close the summary to restart the flow.",hot:[1428,306,1472,348],go:0}
];
const stage=document.getElementById('stage');
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
S.forEach((s,i)=>{const im=new Image();im.src='jarvis/img/proto/'+s.img+'.webp';im.alt=s.title;im.className=i?'hide':'';im.decoding='async';stage.appendChild(im);s.el=im});
const hot=document.createElement('div');hot.className='hot';hot.setAttribute('role','button');hot.tabIndex=0;stage.appendChild(hot);
const bar=document.getElementById('bar');
S.forEach((s,i)=>{const b=document.createElement('button');b.title=(i+1)+'. '+s.title;b.setAttribute('aria-label','Go to step '+(i+1));b.onclick=e=>{e.stopPropagation();show(i)};bar.appendChild(b)});
let cur=0;
function show(i){
  cur=(i+S.length)%S.length;const s=S[cur];
  S.forEach((x,j)=>x.el.classList.toggle('hide',j!==cur));
  const [x1,y1,x2,y2]=s.hot;
  Object.assign(hot.style,{left:x1/W*100+'%',top:y1/H*100+'%',width:(x2-x1)/W*100+'%',height:(y2-y1)/H*100+'%'});
  hot.setAttribute('aria-label',s.do.replace(/<[^>]+>/g,''));
  count.textContent='Step '+(cur+1)+' of '+S.length;
  title.textContent=s.title;tag.textContent=s.tag;why.textContent=s.why;document.getElementById('do').innerHTML=s.do;
  [...bar.children].forEach((b,j)=>b.classList.toggle('on',j<=cur));
  if(!document.body.classList.contains('embed')&&history.replaceState)history.replaceState(null,'','#'+(cur+1));
}
hot.onclick=e=>{e.stopPropagation();show(S[cur].go)};
hot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(S[cur].go)}};
stage.onclick=()=>{stage.classList.remove('flash');void stage.offsetWidth;stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),700)};
prev.onclick=()=>show(cur-1);next.onclick=()=>show(S[cur].go);restart.onclick=()=>show(0);
hint.onchange=()=>document.body.classList.toggle('nohint',!hint.checked);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(S[cur].go);if(e.key==='ArrowLeft')show(cur-1)});
const h=parseInt(location.hash.slice(1));show(h>0&&h<=S.length?h-1:0);
</script>
</body>
</html>
